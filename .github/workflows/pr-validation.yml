name: PR Validation

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions: {}

jobs:
  check-issue-reference:
    name: Check Issue Reference
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Validate closing issue reference
        uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.pull_request?.body ?? '';
            const issueReference = /\b(?:closes|fixes|resolves)\s+#\d+\b/i;

            if (!issueReference.test(body)) {
              core.setFailed('PR body must contain Closes #N, Fixes #N, or Resolves #N.');
            }

  check-approved-issue:
    name: Check Issue Has status:approved
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
    steps:
      - name: Validate linked issues
        uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.pull_request?.body ?? '';
            const references = [
              ...body.matchAll(/\b(?:closes|fixes|resolves)\s+#(\d+)\b/gi),
            ];
            const issueNumbers = [...new Set(references.map((match) => Number(match[1])))];

            if (issueNumbers.length === 0) {
              core.setFailed('No linked issue found in the PR body.');
              return;
            }

            const failures = [];
            for (const issueNumber of issueNumbers) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  ...context.repo,
                  issue_number: issueNumber,
                });
                const labels = issue.labels.map((label) =>
                  typeof label === 'string' ? label : label.name,
                );

                if (issue.pull_request) {
                  failures.push(`#${issueNumber} is a pull request, not an issue.`);
                } else if (!labels.includes('status:approved')) {
                  failures.push(`#${issueNumber} does not have status:approved.`);
                }
              } catch (error) {
                if (error.status === 404) {
                  failures.push(`#${issueNumber} does not exist or is not accessible.`);
                } else {
                  throw error;
                }
              }
            }

            if (failures.length > 0) {
              core.setFailed(failures.join('\n'));
            }

  check-type-label:
    name: Check PR Has type:* Label
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Validate type label
        uses: actions/github-script@v9
        with:
          script: |
            const labels = (context.payload.pull_request?.labels ?? []).map((label) =>
              typeof label === 'string' ? label : label.name,
            );
            const typeLabels = labels.filter((label) => label?.startsWith('type:'));

            if (typeLabels.length !== 1) {
              core.setFailed(`PR must have exactly one type:* label; found ${typeLabels.length}.`);
            }

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out pull request merge candidate
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run Shellcheck
        shell: bash
        run: |
          mapfile -d '' scripts < <(git ls-files -z -- '*.sh')
          if (( ${#scripts[@]} == 0 )); then
            echo 'No tracked shell scripts found; Shellcheck has nothing to validate.'
            exit 0
          fi
          shellcheck "${scripts[@]}"

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out pull request merge candidate
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --requirement backend/requirements.txt "mypy==1.15.0"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run focused authentication tests
        shell: bash
        run: |
          auth_tests=(
            backend/tests/unit/test_auth_config.py
            backend/tests/unit/test_auth_jwks.py
            backend/tests/unit/test_authorization.py
          )
          if [[ ! -e "${auth_tests[0]}" && ! -e "${auth_tests[1]}" && ! -e "${auth_tests[2]}" ]]; then
            echo 'Focused authentication tests are not present on this merge candidate.'
            exit 0
          fi
          python -m pytest "${auth_tests[@]}" -v
      - name: Run full backend test suite
        run: python -m pytest backend/tests -v
      - name: Run mypy
        run: python -m mypy backend --config-file backend/mypy.ini
