# ─────────────────────────────────────────────────────────────
# nginx config for the frontend container
# ─────────────────────────────────────────────────────────────
# Serves the React static bundle AND reverse-proxies /api/* and
# /health to the backend service. This makes the frontend and
# backend same-origin from the browser's perspective → no CORS.

server {
    listen 80;
    server_name _;

    # Root directory where Vite outputs the built bundle
    root /usr/share/nginx/html;
    index index.html;

    # ─── SPA routing fallback ───────────────────────────────
    # React Router uses BrowserRouter. Deep links like
    # /dashboard, /upload, /suppliers/:id/dashboard must serve
    # index.html (not a 404) so React Router can handle the path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Reverse proxy: /api/* → backend ───────────────────
    # The `backend` hostname resolves via Docker's internal DNS
    # (docker-compose) or Kubernetes service DNS (k8s).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        # Pass the original request metadata to the backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Azure AI extraction can take 30-60s; raise the default
        # 60s timeout so nginx doesn't cut the upload response.
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Allow PDF uploads up to 10MB
        client_max_body_size 10M;
    }

    # ─── Health check proxy ────────────────────────────────
    # Lets K8s / Docker probe the frontend container and have
    # it fail if the backend is unreachable.
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # ─── Static asset caching ───────────────────────────────
    # Vite hashes filenames in production (e.g. main.a1b2c3.js)
    # so they are safe to cache aggressively.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
