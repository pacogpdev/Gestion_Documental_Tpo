apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    email: REPLACE_WITH_ACME_EMAIL
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-production-account-key
    solvers:
      - dns01:
          azureDNS:
            subscriptionID: REPLACE_WITH_AZURE_SUBSCRIPTION_ID
            resourceGroupName: REPLACE_WITH_AZURE_DNS_RESOURCE_GROUP
            hostedZoneName: pedroortiz.com
            environment: AzurePublicCloud
            tenantID: REPLACE_WITH_AZURE_TENANT_ID
            clientID: REPLACE_WITH_AZURE_CLIENT_ID
            clientSecretSecretRef:
              name: cert-manager-azuredns
              key: client-secret
