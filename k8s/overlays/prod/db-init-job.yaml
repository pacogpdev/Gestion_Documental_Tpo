apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  namespace: facturas-control
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-init
          image: facturas-backend:latest
          imagePullPolicy: Never
          # seed_db.py is engine-neutral: creates schema (create_all)
          # and seeds data regardless of MSSQL/PostgreSQL/SQLite
          command: ["python", "backend/seed_db.py"]
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
