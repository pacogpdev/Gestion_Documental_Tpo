apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  namespace: facturas-control
spec:
  ttlSecondsAfterFinished: 60
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-init
          image: facturas-backend:latest
          imagePullPolicy: Never
          command: ["python", "backend/seed_db.py"]
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
